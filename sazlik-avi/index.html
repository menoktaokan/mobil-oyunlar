<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sazlık Avı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: tek ekran oyun alanı, üstte skor şeridi, altta mermi + tur sayacı. Tek tema: alacakaranlık sazlık. */
:root{
  --sky-top:#1d2a4a; --sky-low:#e0794a; --reed:#2c3a1e; --reed-hi:#55692c;
  --ink:#fff6e4; --amber:#ffc94a; --hit:#7fe08a; --miss:#ff6b5b; --panel:#141a2c;
  --pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--panel);color:var(--ink);font-family:var(--pixel);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#wrap{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;gap:8px;box-sizing:border-box}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:10px;gap:8px;font-variant-numeric:tabular-nums}
.bar b{color:var(--amber);font-weight:400}
#stage{flex:1;min-height:0;position:relative;border-radius:6px;overflow:hidden;box-shadow:0 0 0 2px #000 inset}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#hud{display:flex;justify-content:space-between;align-items:center;font-size:9px;gap:10px}
.ammo{display:flex;align-items:center;gap:10px}
.shells{display:flex;gap:6px}
#sb{color:var(--amber);font-size:10px;opacity:0;font-variant-numeric:tabular-nums}
#sb.pop{animation:sbpop 1.4s ease-out}
@keyframes sbpop{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:translateY(0)}75%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){#sb.pop{animation:none;opacity:1}}
.shell{width:10px;height:18px;background:var(--amber);border-radius:2px 2px 0 0;box-shadow:inset 0 -5px 0 #a33}
.shell.used{opacity:.18}
#tally{display:flex;gap:3px;flex-wrap:wrap}
.t{width:10px;height:10px;background:#3a4258}
.t.hit{background:var(--hit)} .t.miss{background:var(--miss)} .t.now{outline:1px solid var(--ink)}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(10,14,28,.62);text-align:center;padding:16px}
#overlay h1{font-size:22px;color:var(--amber);margin:0;line-height:1.4;text-shadow:3px 3px 0 #000;text-wrap:balance}
#overlay p{font-size:9px;line-height:1.9;margin:0;max-width:30ch}
button{font-family:var(--pixel);font-size:12px;background:var(--amber);color:#1a1205;border:0;padding:14px 20px;border-radius:4px;box-shadow:0 4px 0 #8a5a10;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5a10}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>

<div id="wrap">
  <div class="bar"><span>TUR <b id="round">1</b></span><span>PUAN <b id="score">0</b></span><span>REKOR <b id="best">0</b></span></div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="overlay">
      <h1>SAZLIK<br>AVI</h1>
      <p>Uçan kuşlara dokun. Her kuş için 3 fişeğin var, artan fişek puan getirir. Turu geçmek için 5 kuştan 4'ünü vur. Üst üste 3 kuş kaçarsa oyun biter.</p>
      <button id="go" type="button">BAŞLA</button>
    </div>
  </div>
  <div id="hud">
    <div class="ammo"><div class="shells" id="shells"></div><span id="sb"></span></div>
    <div id="tally"></div>
  </div>
</div>

<script>
(()=>{
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const overlay=$('overlay'),btn=$('go');
let W=0,H=0,DPR=1;
function fit(){const r=$('stage').getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',fit);fit();

let best=0;try{best=+localStorage.getItem('sazlik-best')||0}catch(e){}
$('best').textContent=best;

// --- ses ---
let ac=null;
function tone(f,d,type='square',v=.08,slide=0){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),ac.currentTime+d);g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}
function bang(){if(!ac)return;const n=ac.sampleRate*.18,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=ac.createBufferSource(),g=ac.createGain();g.gain.value=.35;s.buffer=b;s.connect(g).connect(ac.destination);s.start();}

// --- durum ---
const G={state:'menu',round:1,score:0,birdIdx:0,results:[],shots:3,bird:null,flash:0,msg:'',msgT:0,particles:[],missStreak:0};
const BIRDS_PER_ROUND=5,NEED=4,SHELL_PTS=300;

function renderHud(){
  $('round').textContent=G.round;$('score').textContent=G.score;
  $('shells').innerHTML=[0,1,2].map(i=>`<div class="shell${i>=G.shots?' used':''}"></div>`).join('');
  $('tally').innerHTML=Array.from({length:BIRDS_PER_ROUND},(_,i)=>`<div class="t ${G.results[i]||''} ${i===G.birdIdx&&G.state==='play'?'now':''}"></div>`).join('');
}

const PALS=[{body:'#3d6b4f',wing:'#2a4a37',head:'#1f5c8a',pts:500},{body:'#7a4a2a',wing:'#55331d',head:'#2b2b2b',pts:750},{body:'#c2462e',wing:'#8a2f1f',head:'#f0d24a',pts:1000}];

function spawn(){
  const lvl=G.round-1,f=Math.min(1,lvl/9); // f: 1. turda 0, 10. turda 1
  const sp=Math.min(600,140+lvl*28)*(0.92+Math.random()*.16);
  const kind=Math.random()<Math.min(.6,.15+lvl*.08)?(Math.random()<.4?2:1):0;
  const ang=(-Math.PI/2)+(Math.random()*1.4-.7);
  G.bird={x:W*(.2+Math.random()*.6),y:H*.78,vx:Math.cos(ang)*sp*(Math.random()<.5?-1:1),vy:Math.sin(ang)*sp,sp:sp*(kind?1.15:1),pal:PALS[kind],t:0,alive:true,fall:0,
    turn:.9-f*.75+Math.random()*.2,       // ilk kırılış: 1. turda geç, ileride hemen
    wob:Math.random()*6,wobA:4+f*40,wobF:3+f*5+Math.random(), // sağa-sola salınım turla büyür
    life:6-f*3.4};
  G.shots=3;renderHud();
}

function start(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(ac&&ac.state==='suspended')ac.resume();
  G.round=1;G.score=0;G.missStreak=0;newRound();overlay.hidden=true;
}
function newRound(){G.birdIdx=0;G.results=[];G.state='play';say('TUR '+G.round);spawn();}
function say(m){G.msg=m;G.msgT=1.4;}
function showShellBonus(n){const el=$('sb');el.textContent='+'+n;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}

function endBird(res){
  G.results[G.birdIdx]=res;G.birdIdx++;renderHud();
  G.state='pause';
  G.missStreak=res==='miss'?G.missStreak+1:0;
  if(G.missStreak>=3){setTimeout(gameOver,1100);return;}
  setTimeout(()=>{
    if(G.birdIdx>=BIRDS_PER_ROUND){
      const hits=G.results.filter(r=>r==='hit').length;
      if(hits>=NEED){
        const bonus=hits===BIRDS_PER_ROUND?5000:0;G.score+=bonus;renderHud();
        say(bonus?'MÜKEMMEL! +5000':'TUR GEÇİLDİ');tone(523,.12);setTimeout(()=>tone(784,.2),130);
        G.round++;setTimeout(newRound,1500);
      } else {say('TUR TEKRAR');tone(262,.25,'triangle',.08,-60);setTimeout(newRound,1500);}
    } else {G.state='play';spawn();}
  },res==='hit'?900:1100);
}

function gameOver(){
  G.state='over';tone(330,.3,'triangle',.1,-180);
  if(G.score>best){best=G.score;try{localStorage.setItem('sazlik-best',best)}catch(e){}$('best').textContent=best;}
  overlay.querySelector('h1').innerHTML='OYUN<br>BİTTİ';
  overlay.querySelector('p').textContent=`Üst üste 3 kuş kaçtı. ${G.round}. turda kaldın. Puan: ${G.score}`;
  btn.textContent='TEKRAR';overlay.hidden=false;
}

btn.addEventListener('click',start);

cv.addEventListener('pointerdown',e=>{
  if(G.state!=='play'||G.shots<=0)return;
  const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  G.shots--;G.flash=.08;bang();renderHud();
  const b=G.bird;
  const hitR=Math.max(30,W*.07);
  if(b&&b.alive&&Math.hypot(px-b.x,py-b.y)<hitR){
    b.alive=false;b.vx=0;b.vy=0;
    const shellB=G.shots*SHELL_PTS*G.round;
    G.score+=(b.pal.pts*(1+(G.round-1)*.1)|0)+shellB;renderHud();
    if(shellB)showShellBonus(shellB);
    for(let i=0;i<14;i++)G.particles.push({x:b.x,y:b.y,vx:(Math.random()-.5)*220,vy:(Math.random()-.8)*200,l:.8,c:i%2?b.pal.body:b.pal.wing});
    tone(880,.08,'square',.06);setTimeout(()=>tone(220,.5,'triangle',.08,-150),120);
  } else if(G.shots===0&&b&&b.alive){
    b.escaping=true;say('KAÇTI!');
  }
});

// --- arka plan ---
const reeds=Array.from({length:70},(_,i)=>({x:Math.random(),h:.12+Math.random()*.16,w:2+Math.random()*3,ph:Math.random()*6,top:Math.random()<.35}));
const stars=Array.from({length:30},()=>({x:Math.random(),y:Math.random()*.35,s:Math.random()<.2?2:1}));

function drawBg(t){
  const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1d2a4a');g.addColorStop(.55,'#8a4a5a');g.addColorStop(.8,'#e0794a');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  cx.fillStyle='rgba(255,246,228,.55)';stars.forEach(s=>cx.fillRect(s.x*W|0,s.y*H|0,s.s,s.s));
  // güneş
  cx.fillStyle='#ffc94a';cx.globalAlpha=.85;cx.beginPath();cx.arc(W*.72,H*.74,Math.min(W,H)*.09,0,7);cx.fill();cx.globalAlpha=1;
  // uzak tepeler
  cx.fillStyle='#4a2f45';cx.beginPath();cx.moveTo(0,H*.76);for(let x=0;x<=W;x+=20)cx.lineTo(x,H*.74-Math.sin(x*.012)*14-Math.sin(x*.031)*6);cx.lineTo(W,H);cx.lineTo(0,H);cx.fill();
  // su
  cx.fillStyle='#2e3f5c';cx.fillRect(0,H*.8,W,H*.2);
  cx.fillStyle='rgba(255,201,74,.25)';for(let i=0;i<6;i++){const y=H*.82+i*7;cx.fillRect(W*.72-30+Math.sin(t*2+i)*10,y,60-i*6,2);}
}
function drawReeds(t){
  reeds.forEach(r=>{
    const bx=r.x*W,by=H,hh=r.h*H,sw=Math.sin(t*1.4+r.ph)*6;
    cx.strokeStyle=r.top?'#55692c':'#2c3a1e';cx.lineWidth=r.w;cx.beginPath();cx.moveTo(bx,by);cx.quadraticCurveTo(bx,by-hh*.6,bx+sw,by-hh);cx.stroke();
    if(r.top){cx.fillStyle='#5a3a1e';cx.fillRect(bx+sw-3,by-hh-4,6,14);}
  });
}
function drawBird(b,t){
  cx.save();cx.translate(b.x,b.y);
  const dir=b.vx<0?-1:1;cx.scale(dir,1);
  const s=Math.max(.9,Math.min(1.4,W/380));cx.scale(s,s);
  if(!b.alive){cx.rotate(b.fall>0?Math.PI/2:0);}
  const flap=b.alive?Math.sin(t*22)*1:0;
  cx.fillStyle=b.pal.body;cx.fillRect(-14,-6,24,12);cx.fillRect(-18,-3,6,6);
  cx.fillStyle=b.pal.head;cx.fillRect(8,-12,10,10);
  cx.fillStyle='#ffc94a';cx.fillRect(18,-8,6,4);
  cx.fillStyle='#000';cx.fillRect(13,-10,2,2);
  cx.fillStyle=b.pal.wing;
  if(b.alive){if(flap>0)cx.fillRect(-8,-18,12,12);else cx.fillRect(-8,4,12,10);}
  else cx.fillRect(-8,-4,12,8);
  cx.restore();
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  drawBg(t);
  const b=G.bird;
  if(b&&(G.state==='play'||G.state==='pause')){
    b.t+=dt;
    if(b.alive){
      if(b.escaping||b.t>b.life){b.vx*=.98;b.vy=-b.sp*1.3;}
      else{
        b.turn-=dt;
        if(b.turn<=0){const a=-Math.PI/2+(Math.random()*2.2-1.1);b.vx=Math.cos(a)*b.sp*(Math.random()<.5?-1:1);b.vy=Math.sin(a)*b.sp*(Math.random()<.7?1:-.6);const f=Math.min(1,(G.round-1)/9);b.turn=.7-f*.5+Math.random()*(1-f*.65);}
        if(b.x<20){b.x=20;b.vx=Math.abs(b.vx);} if(b.x>W-20){b.x=W-20;b.vx=-Math.abs(b.vx);}
        if(b.y<24){b.y=24;b.vy=Math.abs(b.vy);} if(b.y>H*.72){b.y=H*.72;b.vy=-Math.abs(b.vy);}
      }
      const wx=b.escaping?0:Math.cos(b.t*b.wobF+b.wob)*b.wobA*b.wobF*dt;
      b.x+=b.vx*dt+wx;b.y+=b.vy*dt;
      if(b.y<-30&&G.state==='play'){if(!b.escaping)say('KAÇTI!');G.bird=null;tone(196,.25,'triangle',.08,-60);endBird('miss');}
    } else {
      b.fall+=dt;
      if(b.fall>.35){b.y+=320*dt;}
      if(b.y>H+30&&G.state==='play'){G.bird=null;endBird('hit');}
    }
    if(G.bird)drawBird(b,t);
  }
  G.particles=G.particles.filter(p=>(p.l-=dt)>0);
  G.particles.forEach(p=>{p.vy+=400*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l*2);cx.fillRect(p.x,p.y,4,4);});cx.globalAlpha=1;
  drawReeds(t);
  if(G.flash>0){G.flash-=dt;cx.fillStyle='rgba(255,246,228,.35)';cx.fillRect(0,0,W,H);}
  if(G.msgT>0){G.msgT-=dt;cx.font=`${Math.max(14,W*.045)|0}px "Press Start 2P", monospace`;cx.textAlign='center';cx.fillStyle='#000';cx.fillText(G.msg,W/2+3,H*.42+3);cx.fillStyle='#ffc94a';cx.fillText(G.msg,W/2,H*.42);}
  requestAnimationFrame(loop);
}
renderHud();requestAnimationFrame(loop);
})();
</script>

</body></html>
